[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudo-brain"
version = "0.0.1"
description = "A streaming, persistent sensorimotor thought-field research model"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pseudo-Brain project" }]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "experiments",
    "experiments/memory_benchmark",
    "experiments/semantic_benchmark",
    "experiments/agent_benchmarks",
]
testpaths = ["tests"]


# Play-gated maze-chase distill: later-tick / full-episode teacher windows.
# Not an RCQ config. Window-32 (longer sequence_length on spawn snippets)
# is falsified. This probe keeps sequence_length = 8 and samples windows
# from across a 240-tick planner trajectory, including pellets and the
# seed-5 clear path. Success is pellets >> 10 or a clear vs planner;
# sticky D / idle no-op is fail even if reward_sum > -161.
schema_version = 2

[run]
name = "play-gated-maze-chase-distill-episode-windows"
seed = 20260818
model_factory = "irene_brain.training.factory:build_thesis_model"
max_optimizer_steps = 32

[dataset]
kind = "maze_chase"
train_sequences = 16
validation_sequences = 4
test_sequences = 2
sequence_length = 8
burn_in_steps = 2
seed_offset = 0
hazard_count = 3
tick_period_ns = 16666667
discount = 0.99
episode_horizon = 240

[optimization]
batch_size = 1
gradient_accumulation_steps = 1
learning_rate = 0.0001
weight_decay = 0.01
max_gradient_norm = 1.0
warmup_steps = 0
scheduler_kind = "constant_after_warmup"

[objective]
action_loss_kind = "support_aware_calibrated_v1"
button_support_control_indices = [4, 7, 22, 26]
button_support_weight = 0.8
button_background_weight = 0.2
button_background_tail_mix = 0.9
button_background_tail_temperature = 0.1
continuous_action_weight = 0.25
action_weight = 1.0
value_weight = 0.1
world_weight = 0.1
diversity_weight = 0.05

[precision]
device = "cuda"
mode = "bfloat16"
allow_tf32 = true

[determinism]
enabled = true
num_workers = 0
compile_model = false

[logging]
log_every_steps = 8
evaluate_every_steps = 32
validation_batches = 4
checkpoint_every_steps = 32
keep_last_checkpoints = 2

[resources]
allow_gpu = true
allow_capture = false
allow_hid_output = false
allow_background_threads = false
allow_network = false
allow_subprocess = false
write_artifacts = true
cpu_threads = 8

schema_version = 1

[run]
name = "dgx-smoke"
seed = 17
model_factory = "irene_brain.training.factory:build_smoke_model"
max_optimizer_steps = 3

[dataset]
kind = "moving_shapes"
train_sequences = 3
validation_sequences = 1
test_sequences = 1
sequence_length = 2
burn_in_steps = 0
seed_offset = 0
hazard_count = 1
tick_period_ns = 16666667
discount = 0.99

[optimization]
batch_size = 1
gradient_accumulation_steps = 1
learning_rate = 0.0003
weight_decay = 0.01
max_gradient_norm = 1.0
warmup_steps = 1

[objective]
action_loss_kind = "support_aware_calibrated_v1"
button_support_control_indices = [4, 7, 22, 26]
button_support_weight = 0.8
button_background_weight = 0.2
button_background_tail_mix = 0.9
button_background_tail_temperature = 0.1
continuous_action_weight = 0.25
action_weight = 1.0
value_weight = 0.1
world_weight = 0.1
diversity_weight = 0.05

[precision]
device = "cuda"
mode = "bfloat16"
allow_tf32 = true

[determinism]
enabled = true
num_workers = 0
compile_model = false

[logging]
log_every_steps = 1
evaluate_every_steps = 3
validation_batches = 1
checkpoint_every_steps = 1
keep_last_checkpoints = 2

[resources]
allow_gpu = true
allow_capture = false
allow_hid_output = false
allow_background_threads = false
allow_network = false
allow_subprocess = false
write_artifacts = true
cpu_threads = 2

# Play-gated maze-chase distill: play-peak / early-stop.
# Not an RCQ config. The 32-step turn-weighted exclusive CE passed
# (A×377 + S×103, 38 pellets). The 128-step continuation of that recipe
# failed sticky S (20 pellets, 390 collisions) after ranking collapsed
# train steps 40→48. Do not scale 128 or retune hold×0.1. This probe keeps
# the same teacher, loss, decode, aux mix, 90 tiled windows, and accum 30.
# The variable is scoring closed-loop play every 8 steps on seeds 5/9 and
# keeping the checkpoint with most pellets (then fewest collisions). Stop
# when play drops from that peak (play_peak_v1), bounded at 64 steps.
schema_version = 2

[run]
name = "play-gated-maze-chase-distill-play-peak"
seed = 20260818
model_factory = "irene_brain.training.factory:build_thesis_model"
max_optimizer_steps = 64

[dataset]
kind = "maze_chase"
train_sequences = 90
validation_sequences = 8
test_sequences = 2
sequence_length = 8
burn_in_steps = 2
seed_offset = 0
hazard_count = 3
tick_period_ns = 16666667
discount = 0.99
episode_horizon = 240
window_sampling = "tiled"

[optimization]
batch_size = 1
gradient_accumulation_steps = 30
learning_rate = 0.0001
weight_decay = 0.01
max_gradient_norm = 1.0
warmup_steps = 0
scheduler_kind = "constant_after_warmup"

[objective]
action_loss_kind = "exclusive_wasd_softmax_turn_weighted_v1"
button_support_control_indices = [4, 7, 22, 26]
button_support_weight = 0.8
button_background_weight = 0.2
button_background_tail_mix = 0.9
button_background_tail_temperature = 0.1
continuous_action_weight = 0.25
action_weight = 1.0
value_weight = 0.1
world_weight = 0.1
diversity_weight = 0.05
play_decode_kind = "exclusive_argmax_wasd_v1"

[precision]
device = "cuda"
mode = "bfloat16"
allow_tf32 = true

[determinism]
enabled = true
num_workers = 0
compile_model = false

[logging]
log_every_steps = 8
evaluate_every_steps = 32
validation_batches = 4
checkpoint_every_steps = 8
keep_last_checkpoints = 8
play_eval_every_steps = 8
play_early_stop_kind = "play_peak_v1"

[resources]
allow_gpu = true
allow_capture = false
allow_hid_output = false
allow_background_threads = false
allow_network = false
allow_subprocess = false
write_artifacts = true
cpu_threads = 8

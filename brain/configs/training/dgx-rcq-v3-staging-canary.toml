# Two-update CUDA staging canary for the schema-3 RCQ-v3 runtime. The
# dedicated DGX launcher stops after update 1, then resumes the exact
# checkpoint for update 2. This is operational evidence only and has no
# scientific gate. It mirrors dgx-rcq-v2-staging-canary.toml exactly except
# for the run name and the registered v3 recipe fields below, so the canary
# exercises the deadzone hinge, the opposite-key pair penalty, and the
# structural deadzone_tanh readout squash on the production runtime before
# the v3 reference run starts.
schema_version = 3

[run]
name = "dgx-rcq-v3-staging-canary"
seed = 1703
model_factory = "irene_brain.training.factory:build_smoke_model"
max_optimizer_steps = 2

[dataset]
kind = "moving_shapes"
train_sequences = 2
validation_sequences = 1
test_sequences = 1
sequence_length = 2
burn_in_steps = 0
seed_offset = 0
hazard_count = 1
tick_period_ns = 16666667
discount = 0.99

[optimization]
batch_size = 1
gradient_accumulation_steps = 1
learning_rate = 0.0003
weight_decay = 0.01
max_gradient_norm = 1.0
warmup_steps = 0
scheduler_kind = "constant_after_warmup"

[objective]
action_loss_kind = "support_aware_calibrated_v1"
button_support_control_indices = [4, 7, 22, 26]
button_support_weight = 0.8
button_background_weight = 0.2
button_background_tail_mix = 0.9
button_background_tail_temperature = 0.1
continuous_action_weight = 0.25
action_weight = 1.0
value_weight = 0.1
world_weight = 0.1
diversity_weight = 0.05
continuous_deadzone_hinge_weight = 0.5
continuous_deadzone_hinge_margin = 0.04
opposite_key_pair_weight = 0.25
continuous_output_squash = "deadzone_tanh"

[[stages]]
index = 0
name = "joint-canary"
start_optimizer_step = 0
end_optimizer_step = 1
trainable_parameters = ["*"]
reset_optimizer = true
learning_rate = 0.0003
weight_decay = 0.01
max_gradient_norm = 1.0
warmup_steps = 0
scheduler_kind = "constant_after_warmup"
action_weight = 1.0
value_weight = 0.1
world_weight = 0.1
diversity_weight = 0.05
transition_gate = "none"
completion_gate = "none"
invariance_audit = "none"

[[stages]]
index = 1
name = "value-head-only-canary"
start_optimizer_step = 1
end_optimizer_step = 2
trainable_parameters = [
  "model.value_per_thought.bias",
  "model.value_per_thought.weight",
]
reset_optimizer = true
learning_rate = 0.0003
weight_decay = 0.0
max_gradient_norm = 1.0
warmup_steps = 0
scheduler_kind = "constant_after_warmup"
action_weight = 0.0
value_weight = 1.0
world_weight = 0.0
diversity_weight = 0.0
transition_gate = "none"
completion_gate = "none"
invariance_audit = "nonvalue_action_state_v1"

[precision]
device = "cuda"
mode = "bfloat16"
allow_tf32 = true

[determinism]
enabled = true
num_workers = 0
compile_model = false

[logging]
log_every_steps = 1
evaluate_every_steps = 1
validation_batches = 1
checkpoint_every_steps = 1
keep_last_checkpoints = 2

[resources]
allow_gpu = true
allow_capture = false
allow_hid_output = false
allow_background_threads = false
allow_network = false
allow_subprocess = false
write_artifacts = true
cpu_threads = 2

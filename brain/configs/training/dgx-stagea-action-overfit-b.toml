schema_version = 1

[run]
name = "dgx-stagea-action-overfit-b"
seed = 1701
model_factory = "irene_brain.training.factory:build_thesis_model"
max_optimizer_steps = 300

[dataset]
kind = "moving_shapes"
train_sequences = 8
validation_sequences = 8
test_sequences = 8
sequence_length = 8
burn_in_steps = 2
seed_offset = 0
hazard_count = 3
tick_period_ns = 16666667
discount = 0.99

[optimization]
batch_size = 1
gradient_accumulation_steps = 8
learning_rate = 0.0001
weight_decay = 0.0
max_gradient_norm = 1.0
warmup_steps = 10

[objective]
action_loss_kind = "support_aware_calibrated_v1"
button_support_control_indices = [4, 7, 22, 26]
button_support_weight = 0.8
button_background_weight = 0.2
button_background_tail_mix = 0.9
button_background_tail_temperature = 0.1
continuous_action_weight = 0.25
action_weight = 1.0
value_weight = 0.0
world_weight = 0.0
diversity_weight = 0.0

[precision]
device = "cuda"
mode = "bfloat16"
allow_tf32 = true

[determinism]
enabled = true
num_workers = 0
compile_model = false

[logging]
log_every_steps = 10
evaluate_every_steps = 100
validation_batches = 8
checkpoint_every_steps = 100
keep_last_checkpoints = 3

[resources]
allow_gpu = true
allow_capture = false
allow_hid_output = false
allow_background_threads = false
allow_network = false
allow_subprocess = false
write_artifacts = true
cpu_threads = 8
